apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-config
  namespace: portfolio
  labels:
    app.kubernetes.io/name: portfolio
data:
  # API Gateway
  NODE_ENV: "production"
  PORT: "8000"
  API_GATEWAY_HOST: "0.0.0.0"
  
  # AI Service
  AI_SERVICE_URL: "http://ai-service:8001"
  PYTHONUNBUFFERED: "1"
  
  # Frontend
  # Note: API_URL is set directly in web deployment.yaml
  
  # CORS (update with your actual domain in production)
  # For API Gateway (comma-separated string)
  CORS_ORIGIN: "http://localhost:3000,http://127.0.0.1:3000,http://web:3000"
  # For AI Service (must be JSON array format for Pydantic settings)
  CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://web:3000"]'
