apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: portfolio
  labels:
    app: ai-service
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/component: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: prajwal270/portfolio-ai-service:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
              protocol: TCP
          env:
            # From ConfigMap
            - name: PYTHONUNBUFFERED
              valueFrom:
                configMapKeyRef:
                  name: portfolio-config
                  key: PYTHONUNBUFFERED
            - name: API_GATEWAY_URL
              value: "http://api-gateway:8000"
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: portfolio-config
                  key: CORS_ORIGINS
            # From Secrets
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: OPENAI_API_KEY
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      restartPolicy: Always
