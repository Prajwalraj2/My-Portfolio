apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: portfolio
  labels:
    app: web
    app.kubernetes.io/name: web
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30090
      protocol: TCP
