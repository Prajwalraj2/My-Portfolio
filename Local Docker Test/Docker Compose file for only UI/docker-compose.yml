version: "3.8"

services:
  # ===========================================
  # Web Frontend - Next.js
  # Connects to any backend via API_URL env var
  # ===========================================
  web:
    image: prajwal270/portfolio-web:v2
    container_name: portfolio-web-local
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_URL=${API_URL}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
