[project]
name = "prajwalraj-mcp"
version = "0.1.0"
description = "MCP server exposing Prajwal Raj's portfolio tools (projects, skills, GitHub, meetings) to Cursor, Claude Desktop, and Claude Code."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prajwal Raj" }]
keywords = ["mcp", "model-context-protocol", "portfolio", "prajwalraj"]
dependencies = [
    "fastmcp>=2.3.0",
    "httpx>=0.28.0",
]

[project.scripts]
prajwalraj-mcp = "prajwalraj_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prajwalraj_mcp"]
